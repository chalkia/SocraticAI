<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocraticAI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#4A90E2">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
    <div id="app">
        <header>
            <h1 id="app-title">SocraticAI</h1>
            <select id="lang-selector">
                <option value="gr">Ελληνικά</option>
                <option value="en">English</option>
            </select>
        </header>

        <main id="main-content">
            <div id="auth-screen" class="screen">
                <button id="btn-teacher" class="role-btn">Εκπαιδευτικός / Teacher</button>
                <button id="btn-student" class="role-btn">Μαθητής / Student</button>
            </div>
            
            <div id="teacher-screen" class="screen" style="display:none;"></div>
            <div id="student-screen" class="screen" style="display:none;"></div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
